name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}
  DBT_VERSION: "1.8.6"

jobs:
  lint:
    name: SQL Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install sqlfluff
        run: |
          pip install sqlfluff sqlfluff-templater-dbt
      
      - name: Lint SQL files
        run: |
          sqlfluff lint models/ --dialect databricks
        continue-on-error: true

  test:
    name: dbt Build & Test
    runs-on: ubuntu-latest
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN || vars.DATABRICKS_TOKEN }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST || vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH || vars.DATABRICKS_HTTP_PATH }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Install dbt packages
        run: |
          dbt deps

      - name: Check project (models, refs, tests)
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST || 'not-set.cloud.databricks.com' }}
          DATABRICKS_HTTP_PATH: ${{ env.DATABRICKS_HTTP_PATH || '/sql/not-set' }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN || 'not-set' }}
        run: |
          dbt parse --target ci

      - name: Skip build when Databricks is not set up
        if: env.DATABRICKS_TOKEN == ''
        run: echo "::notice::No Databricks credentials set, so dbt build is skipped."
      
      - name: Run dbt debug
        if: env.DATABRICKS_TOKEN != ''
        run: |
          dbt debug --target ci
      
      - name: Run dbt build (CI)
        if: env.DATABRICKS_TOKEN != ''
        run: |
          dbt build --target ci

  docs:
    name: Generate & Deploy dbt Docs
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && vars.DATABRICKS_HOST != ''
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN || vars.DATABRICKS_TOKEN }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST || vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH || vars.DATABRICKS_HTTP_PATH }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          dbt deps
      
      - name: Generate dbt docs
        run: |
          dbt docs generate --target prod
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
          publish_branch: gh-pages
