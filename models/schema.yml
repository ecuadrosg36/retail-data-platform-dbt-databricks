version: 2

models:
  - name: int_order_details
    columns:
      - name: order_id
        tests: [not_null]

  - name: fct_sales
    columns:
      - name: customer_id
        tests: [not_null]
      - name: total_sales
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
